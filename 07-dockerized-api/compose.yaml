services:
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: app
      DB_PASSWORD: local-only
      DB_NAME: app
    depends_on: [postgres]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: app
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data: